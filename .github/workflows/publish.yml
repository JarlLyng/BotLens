name: Publish to Chrome Web Store

# Publishes a build to the Chrome Web Store through Chrome Web Store API V2.
# - Runs automatically when a version tag (v*) is pushed, and publishes.
# - Can also be triggered manually from the Actions tab (workflow_dispatch),
#   where "check" (the default) only verifies the credentials and uploads nothing.
#
# Authentication is keyless (#43). GitHub's OIDC token is exchanged, through
# Workload Identity Federation, for a short-lived Google access token for the
# service account the Developer Dashboard lists as this publisher's. Nothing
# expires and the repo holds no Google secret. Google accepts the token only
# from this repo and JarlLyng/PageLens.
#
# Repository variables (Settings → Secrets and variables → Actions → Variables):
#   CWS_WIF_PROVIDER, CWS_SERVICE_ACCOUNT, CWS_PUBLISHER_ID
# and one secret: CWS_EXTENSION_ID.
# This workflow never runs on pull_request, so a PR from a fork cannot obtain a token.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      mode:
        description: 'check: verify credentials only. draft: upload without publishing. publish: upload and submit.'
        type: choice
        options: [check, draft, publish]
        default: check

permissions:
  contents: read
  id-token: write   # lets google-github-actions/auth request GitHub's OIDC token

concurrency:
  group: cws-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Optional human-in-the-loop gate: create an Environment named
    # "chrome-web-store" with required reviewers to require approval before
    # anything is uploaded. Safe to leave as-is if you don't set one up.
    environment: chrome-web-store
    env:
      # push-triggered runs always publish; manual runs honor the input.
      MODE: ${{ github.event_name == 'push' && 'publish' || inputs.mode }}
      EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
      PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # A tag push publishes to every user. The tests are the gate that stops a
      # parser or scoring regression (#24 was one) from shipping on its own.
      - name: Tests
        run: npm test

      - name: Build extension zip
        run: npm run build

      # Fails fast with a readable message instead of an API error.
      - name: Check configuration
        env:
          WIF_PROVIDER: ${{ vars.CWS_WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.CWS_SERVICE_ACCOUNT }}
        run: |
          for v in WIF_PROVIDER SERVICE_ACCOUNT PUBLISHER_ID EXTENSION_ID; do
            [ -n "${!v}" ] || { echo "::error::$v is not set (see the comment at the top of this workflow)."; exit 1; }
          done

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.CWS_WIF_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false

      # check: asks the API for the item's status and changes nothing.
      # draft: uploads without submitting. publish: uploads and submits.
      - name: Chrome Web Store (${{ env.MODE }})
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          if [ "$MODE" = "check" ]; then
            node scripts/cws.js check
          else
            node scripts/cws.js "$MODE" "$(ls dist/botlens-*.zip)"
          fi
