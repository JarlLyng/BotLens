name: Deploy Marketing Website

on:
  push:
    branches: [ main ]
    paths: [ 'website/**' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pushes go straight to main, and the Lint workflow runs alongside this one
      # without blocking it. So the check also lives here, before the upload: a
      # mismatch fails the deploy and the live site keeps its last consistent
      # version. The script has no dependencies, so no npm install is needed.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: FAQPage JSON-LD matches the visible FAQ
        run: node scripts/check-faq-jsonld.js

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './website'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
