name: 🐛 Bug Report
description: Report a bug to help us improve BotLens
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us what you expected to happen.
      placeholder: Tell us what you did and what went wrong.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: BotLens Version
      description: Which version of the extension are you using?
      placeholder: e.g. 1.0.0
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Browser version, OS, or specific website URL where the bug occurred.
