<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BotLens — small promo tile</title>
  <link rel="stylesheet" href="../../tokens.css">
  <style>
    html, body {
      width: 440px;
      height: 280px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      color: #fff;
    }
    body {
      position: relative;
      background:
        radial-gradient(ellipse 500px 380px at 20% 20%, rgba(164, 53, 210, 0.45), transparent 65%),
        radial-gradient(ellipse 400px 300px at 100% 100%, rgba(208, 255, 0, 0.22), transparent 60%),
        #0a0a0a;
    }
    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: radial-gradient(ellipse at center, black 40%, transparent 85%);
    }
    .content {
      position: relative;
      z-index: 1;
      height: 100%;
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand img {
      width: 36px;
      height: 36px;
      border-radius: 8px;
    }
    .brand .name {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .brand .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #D0FF00;
      margin-left: 4px;
      box-shadow: 0 0 10px rgba(208, 255, 0, 0.8);
    }
    h1 {
      font-size: 30px;
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin: 0;
    }
    h1 .accent { color: #D0FF00; }
    .caption {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: rgba(255,255,255,0.6);
      letter-spacing: 0.01em;
    }
    .caption .divider {
      width: 4px; height: 4px; border-radius: 50%;
      background: rgba(255,255,255,0.3);
    }
    .score-badge {
      position: absolute;
      right: 32px;
      top: 50%;
      transform: translateY(-40%);
      width: 88px;
      height: 88px;
    }
    .score-badge svg { width: 100%; height: 100%; display: block; }
    .score-badge .track { fill: none; stroke: rgba(255,255,255,0.10); stroke-width: 3; }
    .score-badge .fill { fill: none; stroke: #D0FF00; stroke-width: 3; stroke-linecap: round;
      stroke-dasharray: 92, 100; }
    .score-badge .num {
      fill: #fff; font-family: system-ui; font-size: 10px; font-weight: 800;
      text-anchor: middle;
    }
    .score-badge .label {
      fill: rgba(255,255,255,0.55); font-family: system-ui; font-size: 2.6px; font-weight: 600;
      text-anchor: middle; letter-spacing: 0.15em; text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="grid"></div>
  <div class="content">
    <div class="brand">
      <img src="../../icons/icon128.png" alt="BotLens">
      <span class="name">BotLens</span>
      <span class="dot"></span>
    </div>

    <h1>Can AI <span class="accent">read</span><br>your website?</h1>

    <div class="caption">
      <span>robots.txt</span>
      <span class="divider"></span>
      <span>meta &amp; semantics</span>
      <span class="divider"></span>
      <span>JS rendering</span>
    </div>
  </div>

  <div class="score-badge">
    <svg viewBox="0 0 36 36">
      <path class="track" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
      <path class="fill" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
      <text x="18" y="19" class="num">92</text>
      <text x="18" y="24" class="label">AI ready</text>
    </svg>
  </div>
</body>
</html>
