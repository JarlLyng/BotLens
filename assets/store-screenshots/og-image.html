<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BotLens — OG image</title>
  <link rel="stylesheet" href="../../tokens.css">
  <style>
    html, body {
      width: 1200px; height: 630px; margin: 0; padding: 0;
      overflow: hidden; color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
    }
    body {
      position: relative;
      background:
        radial-gradient(ellipse 900px 700px at 15% 25%, rgba(164, 53, 210, 0.45), transparent 60%),
        radial-gradient(ellipse 800px 600px at 95% 95%, rgba(208, 255, 0, 0.24), transparent 60%),
        #0a0a0a;
    }
    .grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse at center, black 40%, transparent 85%);
    }
    .content {
      position: relative; z-index: 1; height: 100%;
      padding: 64px 80px;
      display: flex; flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
    }
    .brand {
      display: inline-flex; align-items: center; gap: 16px;
    }
    .brand img { width: 56px; height: 56px; border-radius: 12px; }
    .brand .name { font-size: 32px; font-weight: 800; letter-spacing: -0.02em; }
    .brand .dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: #D0FF00; box-shadow: 0 0 14px rgba(208, 255, 0, 0.9);
    }
    .middle {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 60px;
    }
    h1 {
      font-size: 84px;
      line-height: 1.02;
      font-weight: 800;
      letter-spacing: -0.035em;
      margin: 0;
      max-width: 760px;
    }
    h1 .accent { color: #D0FF00; }
    .score {
      width: 200px; height: 200px;
      position: relative;
      filter: drop-shadow(0 0 40px rgba(208, 255, 0, 0.25));
    }
    .score svg { width: 100%; height: 100%; display: block; }
    .footer-row {
      display: flex;
      align-items: center;
      gap: 24px;
      color: rgba(255,255,255,0.72);
      font-size: 22px;
    }
    .footer-row .divider {
      width: 6px; height: 6px; border-radius: 50%;
      background: rgba(255,255,255,0.35);
    }
    .footer-row .url {
      color: #D0FF00;
      font-weight: 700;
      font-family: ui-monospace, monospace;
      font-size: 20px;
      letter-spacing: 0.01em;
      margin-left: auto;
    }
  </style>
</head>
<body>
  <div class="grid"></div>
  <div class="content">
    <div class="brand">
      <img src="../../icons/icon128.png" alt="BotLens">
      <span class="name">BotLens</span>
      <span class="dot"></span>
    </div>

    <div class="middle">
      <h1>Can <span class="accent">AI</span> read your website?</h1>
      <div class="score">
        <svg viewBox="0 0 36 36">
          <path fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="2.6"
                d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
          <path fill="none" stroke="#D0FF00" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="92, 100"
                d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
          <text x="18" y="20.5" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="9" font-weight="800">92</text>
        </svg>
      </div>
    </div>

    <div class="footer-row">
      <span>robots.txt</span>
      <span class="divider"></span>
      <span>semantic HTML</span>
      <span class="divider"></span>
      <span>JS rendering</span>
      <span class="url">botlens.iamjarl.com</span>
    </div>
  </div>
</body>
</html>
